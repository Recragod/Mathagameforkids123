<!DOCTYPE html>
<HTML>
        <head>
            <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css') }}">

            <title>Math Masters | Login</title> <!-- Title to my webpage -->
        
        <style>
            .login-box
            {   
                width:300px;
                margin:100px auto;
                padding:20px;
                border:2px solid #333;
                background-color: #f9f9f9;
                text-align:center;
            }

            input
            {
                width: 90%;
                padding: 10px;
                margin: 10px 0;
            }

            button
            {
                padding: 10px 20px;
                cursor: pointer;
            }

            
            h1{
                 font-family: 'Times New Roman', Times, serif;
            }

            body {
             background-image: url('suburu1.jpg');
            }
        </style>


        </head>

    <body>
        <!--div class connects to style sheet: login-box-->
        <div class="login-box">
            <h2>Login Page</h2> <!-- main heading for my login page -->

            <form method="POST" action="/login"> <!-- creates a form for the user to login -->

                <!-- Creates text field for user to type in their username -->
                <input type="text" name="username" placeholder="Username" required>
                <br><br>
                <!-- Creates text field for user to type in their password -->
                <input type="password" name="password" placeholder="Password" required>
                <br><br>
                <!-- Creates a button to complete login-->
                <button type="submit">Login</button>
            </form>
            <br>
            <!--Sign Up button opens a popup-->
            <button class="signup-btn" onclick="openSignupWindow()">Sign Up</button>
        </div>

        
        <script src="/static/script.js"></script>

    </body>
</HTML>
