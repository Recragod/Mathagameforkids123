<!DOCTYPE html>
<HTML>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css') }}"> <!-- links the external CSS stylesheet to this page -->
        <title>Math Masters | Login</title> <!-- Title to my webpage -->
    </head>

    <body>
        <div class="login-box"> <!--div class connects to style sheet: login-box-->
            <h2>Login Page</h2>  <!-- main heading for my login page -->
            <form method="POST" action="/login"> <!-- creates a form for the user to login -->
                <!-- Creates text field for user to type in their username -->
                <input class="login-input" type="text" name="username" placeholder="Username" required> 
                <br><br> <!-- creates a break in the text -->
                <!-- Creates text field for user to type in their password -->
                <input class="login-input" type="password" name="password" placeholder="Password" required> 
                <br><br>
                {% if error %} <!--sends an error message if login fails-->
                    <p class="error-message">{{ error }}</p> <!-- shows the user that the username or password is invalid -->
                {% endif %}
                <button class="login-button" type="submit">Login</button>  <!-- Creates a button to complete login-->
            </form>
            <br> <!-- creates a break in the text -->
            <button class="signup-btn" onclick="openSignupWindow()">Sign Up</button> <!--Sign Up button opens a popup-->
        </div>
        <!-- links the JavaScript file which handles the signup popup -->
        <script src="{{ url_for('static', filename='script.js') }}"></script>

    </body>
</HTML>
