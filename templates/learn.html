<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css') }}"> <!-- links the external CSS stylesheet to this page -->
        <title>Math Masters | Learn</title> <!-- creates a title for the HTML page -->
    </head>
    <body>
        <div class="menu-bar"> <!-- fixed navbar at the top of the page -->
            <a href="/home" class="menu-logo">  <!-- clicking the logo takes the user back to the homepage -->
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2MKA6HWT8Qk-hn5AzfdHMYnVDRCwlukys5Q&s" alt="Logo" class="navbarlogo">
            </a>
            <div class="navbarlinks"> <!-- container for the nav links centered in the navbar -->
                <a href="/home">Home</a> <!-- creates a link to the homepage -->
                <a href="/learn">Learning Math</a> <!-- creates a link to the learning math page -->
                <a href="/practice">Practice</a> <!-- creates a link to the practice page -->
                <a href="/logout">Log Out</a> <!-- creates a link to the login page -->
            </div>
        </div>
        
        <div class="learn-page"> <!-- main content area for the learning topic selection page -->
            <h1 class="learnpagetitle">Let's start learning math!!!</h1> <!-- Creates a title for the learning page -->
            <p class="learnpagesubtitle">Select topics from below.</p> <!-- Creates a subttitle for the learning page -->
            
            <div class="learngrid"> <!-- 2x2 grid layout containing the four learning topic buttons -->
                <a href="addition" class="learnbutton"> <!-- this addition button links to its own learning topic page -->
                    <span class="learn-icon">+</span> <!-- math symbol displayed at the top of the button -->
                    <h2>Addition</h2> <!-- text that shows Addition -->
                </a>
                <a href="subtraction" class="learnbutton"> <!-- this subtraction button links to its own learning topic page -->
                    <span class="learn-icon">−</span> <!-- math symbol displayed at the top of the button -->
                    <h2>Subtraction</h2> <!-- text that shows Subtraction -->
                </a>
                <a href="multiplication" class="learnbutton"> <!-- this multiplication button links to its own learning topic page -->
                    <span class="learn-icon">×</span> <!-- math symbol displayed at the top of the button -->
                    <h2>Multiplication</h2> <!-- text that shows Multiplication -->
                </a>
                <a href="division" class="learnbutton"> <!-- this division button links to its own learning topic page -->
                    <span class="learn-icon">÷</span> <!-- math symbol displayed at the top of the button -->
                    <h2>Division</h2>  <!-- text that shows Division -->
                </a>
            </div>
        </div>
    
    <footer class="footer"> <!-- footer with quick nav links -->
